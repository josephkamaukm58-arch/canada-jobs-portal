<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | CANADA JOBS</title>
<link rel="stylesheet" href="style.css">
<style>
.login-container {
    max-width: 430px;
    margin: 70px auto;
    padding: 35px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 25px #0001;
}
.login-container h1 {
    color: #d71920;
    text-align: center;
    margin-bottom: 15px;
}
.login-container input {
    width: 100%;
    padding: 15px;
    margin: 12px 0;
    border: 1px solid #ddd;
    border-radius: 6px;
}
.login-container button {
    width: 100%;
    padding: 15px;
    background: #d71920;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>
<body>
<div class="login-container">
<h1>🍁 CANADA JOBS</h1>
<h2>Welcome Back</h2>
<p>Sign in to continue exploring opportunities.</p>

<form id="loginForm">
<input type="email" placeholder="Email Address" required>
<input type="password" placeholder="Password" required>
<button type="submit">SIGN IN</button>
</form>

<div id="message"></div>
<p>Don't have an account? <a href="index.html#register">Register here</a></p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    document.getElementById("message").innerHTML =
    "Sign-in is not connected yet. Please complete account setup first.";
});
</script>
</body>
</html>
