<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | CANADA JOBS</title>
<link rel="stylesheet" href="style.css">
<style>
.admin-container {
    max-width: 850px;
    margin: 50px auto;
    padding: 25px;
}
.admin-container h1 {
    color: #d71920;
    margin-bottom: 25px;
}
.admin-card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 15px #0001;
    margin-bottom: 25px;
}
.admin-card input,
.admin-card textarea {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 6px;
}
.admin-card button {
    background: #d71920;
    color: white;
    border: none;
    padding: 13px 22px;
    border-radius: 6px;
    cursor: pointer;
}
#dashboard {
    display: none;
}
</style>
</head>
<body>

<header>
<div class="logo">🍁 CANADA JOBS ADMIN</div>
<nav><a href="index.html">Visit Website</a></nav>
</header>

<div class="admin-container">

<div class="admin-card" id="login">
<h1>Administrator Login</h1>
<form id="loginForm">
<input type="password" id="adminPassword"
placeholder="Admin Password" required>
<button type="submit">SIGN IN</button>
</form>
<p id="loginMessage"></p>
</div>

<div id="dashboard">
<h1>Admin Dashboard</h1>

<div class="admin-card">
<h2>Add New Job Vacancy</h2>
<form id="jobForm">
<input id="title" placeholder="Job Title" required>
<input id="location" placeholder="Job Location" required>
<input id="salary" placeholder="Monthly Salary (CAD)" required>
<textarea id="description" placeholder="Job Description" required></textarea>
<button type="submit">ADD JOB</button>
</form>
<p id="jobMessage"></p>
</div>

<div class="admin-card">
<h2>Manage Job Listings</h2>
<div id="jobList"></div>
</div>

<button onclick="logout()">LOG OUT</button>
</div>

</div>

<script src="admin.js"></script>
</body>
</html>
